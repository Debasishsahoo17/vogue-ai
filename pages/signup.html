<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup | VOGUE.AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ===== RESET ===== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

/* ===== BODY & BACKGROUND ===== */
body { 
  background: 
    linear-gradient(120deg, rgba(10,11,15,0.85), rgba(15,16,24,0.85)),
    url('https://cdn.prod.website-files.com/603f5d1df4ee236b69719ff2/65e81d04f6a87e38c021a301_65c4aca19461c18275d991c9.webp') no-repeat center center fixed;
  background-size: cover;
  background-blend-mode: overlay;
  color: #f5f5f5;
  overflow-x: hidden;
  transition: background 1s, color 0.5s;
  min-height: 100vh;
  scroll-behavior: smooth;
}

/* ===== NAVBAR ===== */
.navbar{
  position: fixed;
  width: 100%;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 50px;
  background: rgba(15,17,30,0.85);
  z-index:1000;
  border-bottom:1px solid rgba(255,255,255,0.05);
  box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
}
.nav-links a{
  margin-left:30px;
  text-decoration:none;
  color:#f5f5f5;
  transition: 0.3s;
  font-weight:500;
}
.nav-links a:hover { color:#d4af37; }

.logo {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(90deg, #d4af37, #f5f5f5);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  display: inline-block;
  text-shadow: 0 0 25px rgba(212, 175, 55, 0.9);
  animation: shimmer 3s infinite linear;
}
@keyframes shimmer { 0%{ background-position:0% 50%; } 100%{ background-position:100% 50%; } }

/* ===== SIGNUP CONTAINER ===== */
.signup-container {
  width: 100%;
  min-height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding: 80px 20px 40px;
}

/* ===== PREMIUM GLASS FORM ===== */
.signup-form {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(22px);
  padding: 60px 50px;
  border-radius: 25px;
  width: 100%;
  max-width: 450px;
  box-shadow: 0 50px 150px rgba(0,0,0,0.8);
  display:flex;
  flex-direction: column;
  gap: 25px;
  animation: slideUp 1s ease forwards;
  transform: translateY(50px);
  opacity: 0;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.signup-form:hover {
  transform: translateY(-10px) rotateX(3deg) rotateY(3deg) scale(1.02);
  box-shadow: 0 60px 180px rgba(212,175,55,0.9);
}
@keyframes slideUp { to { transform: translateY(0); opacity: 1; } }

.signup-form h2 {
  font-size: 34px;
  text-align:center;
  background: linear-gradient(90deg, #d4af37, #f5f5f5);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 25px rgba(212,175,55,0.9);
  margin-bottom: 15px;
}

/* ===== FLOATING LABEL INPUTS ===== */
.input-group {
  position: relative;
  display:flex;
  flex-direction: column;
}
.input-group input {
  padding: 16px 15px;
  border-radius: 12px;
  border:none;
  background: rgba(255,255,255,0.12);
  color: #f5f5f5;
  font-size: 16px;
  transition: 0.3s;
}
.input-group input::placeholder { color: transparent; }
.input-group label {
  position: absolute;
  left:15px;
  top:16px;
  color: rgba(255,255,255,0.7);
  font-size:16px;
  pointer-events:none;
  transition:0.3s;
}
.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label {
  top:-10px;
  font-size:13px;
  color:#d4af37;
  font-weight:500;
}
.input-group input:focus { outline:none; background: rgba(255,255,255,0.2); box-shadow: 0 0 18px rgba(212,175,55,0.6); }

/* ===== PREMIUM BUTTONS ===== */
.signup-form button {
  padding: 16px;
  border:none;
  border-radius:12px;
  background: linear-gradient(90deg, #d4af37, #f5f5f5);
  color:#111;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
  box-shadow: 0 12px 30px rgba(212,175,55,0.5);
}
.signup-form button:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 45px rgba(212,175,55,0.8);
}

/* ===== SOCIAL LOGIN BUTTONS ===== */
.social-btn {
  display:flex;
  gap:15px;
  justify-content:center;
  margin-top:10px;
}
.social-btn button {
  flex:1;
  padding:12px 0;
  border:none;
  border-radius:12px;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background: rgba(255,255,255,0.1);
  color:#f5f5f5;
  box-shadow:0 5px 20px rgba(212,175,55,0.4);
  transition:0.3s;
}
.social-btn button i { font-size:18px; }
.social-btn button:hover { background: rgba(212,175,55,0.18); box-shadow:0 8px 25px rgba(212,175,55,0.6); }

/* ===== LIGHT THEME ===== */
body.light-theme {
  background: 
    linear-gradient(135deg, rgba(245,245,245,0.85), rgba(232,232,238,0.85)),
    url('https://cdn.prod.website-files.com/603f5d1df4ee236b69719ff2/65e81d04f6a87e38c021a301_65c4aca19461c18275d991c9.webp') no-repeat center center fixed;
  background-size: cover;
  background-blend-mode: overlay;
  color: #111;
}
body.light-theme .signup-form {
  background: rgba(255,255,255,0.95);
  color: #111;
}
body.light-theme .signup-form input {
  background: rgba(0,0,0,0.05);
  color:#111;
}
body.light-theme .input-group label {
  color: rgba(0,0,0,0.7);
}
body.light-theme .input-group input:focus + label {
  color: #d4af37;
}
body.light-theme .signup-form input::placeholder { color:#555; }
body.light-theme .signup-form button { color:#111; }
body.light-theme .navbar { background: rgba(255,255,255,0.95); border-bottom:1px solid rgba(0,0,0,0.08);}
body.light-theme .nav-links a { color: #111; }
body.light-theme .logo {
  background: linear-gradient(90deg, #d4af37,#b38f5b);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(179,143,91,0.8);
  animation: shimmer 3s infinite linear;
}

/* ===== FOOTER ===== */
footer {
  text-align:center;
  padding:20px 10px;
  margin-top: 50px;
  background: rgba(15,17,30,0.85);
  color:#f5f5f5;
  border-top:1px solid rgba(255,255,255,0.05);
  backdrop-filter: blur(8px);
}
body.light-theme footer { background: rgba(255,255,255,0.95); color:#111; border-top:1px solid rgba(0,0,0,0.08); }

/* RESPONSIVE */
@media(max-width:500px){
  .signup-form { padding: 40px 25px; }
  .signup-form h2 { font-size:28px; }
  .social-btn { flex-direction: column; }
}
</style>
</head>

<body>
<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">VOGUE.AI</div>
  <div class="nav-links">
    <a href="../index.html"><i class="fa fa-home"></i>Home</a>
    <a href="recommend.html"><i class="fa fa-shirt"></i>Recommended</a>
    <a href="tryon.html"><i class="fa fa-user"></i>Try-On</a>
    <a href="contact.html"><i class="fa fa-envelope"></i>Contact</a>
  </div>
  <i class="fas fa-moon theme-toggle" id="themeToggle" title="Toggle Dark/Light" style="cursor:pointer; font-size:18px;"></i>
</div>

<!-- SIGNUP FORM -->
<div class="signup-container">
  <form class="signup-form">
    <h2>Sign Up</h2>
    <div class="input-group">
      <input type="text" placeholder="Full Name" required>
      <label>Full Name</label>
    </div>
    <div class="input-group">
      <input type="email" placeholder="Email Address" required>
      <label>Email Address</label>
    </div>
    <div class="input-group">
      <input type="password" placeholder="Password" required>
      <label>Password</label>
    </div>
    <button type="submit">Create Account</button>

    <div class="social-btn">
      <button type="button"><i class="fab fa-google"></i> Google</button>
      <button type="button"><i class="fab fa-facebook"></i> Facebook</button>
    </div>
  </form>
</div>

<!-- FOOTER -->
<footer>
  &copy; 2026 VOGUE.AI | All Rights Reserved
</footer>

<script>
// ===== THEME TOGGLE =====
const toggle = document.getElementById('themeToggle');
toggle.addEventListener('click', () => {
  document.body.classList.toggle('light-theme');
  if(document.body.classList.contains('light-theme')){
    toggle.classList.replace('fa-moon','fa-sun');
  } else {
    toggle.classList.replace('fa-sun','fa-moon');
  }
});
</script>

</body>
</html>
